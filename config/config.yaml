# openclash-sub-converter 服务配置示例
# 所有字段均有默认值；文件缺失时服务使用默认配置启动。
# 环境变量可覆盖：OSC_PORT / OSC_FETCHER_UA / OSC_CACHE_TTL / OSC_LOG_LEVEL

server:
  port: 25500          # HTTP 监听端口

fetcher:
  user_agent: "clash-verge/v2.0.0"  # 拉取订阅源时携带的 UA（部分机场校验 UA）
  timeout_seconds: 20               # 单源拉取超时（秒）
  cache_ttl_seconds: 300            # 订阅源内存缓存 TTL（秒），0 关闭缓存
  max_bytes: 10485760               # 单源响应体上限（字节，默认 10MB）

logging:
  level: info           # 日志级别: debug / info / warn / error
